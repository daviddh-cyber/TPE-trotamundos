server:
  port: 8083

spring:
  application:
    name: asistente
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Servicios que usan las herramientas del asistente (ADR 014)
trotamundos:
  viajes:
    url: ${VIAJES_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
