server:
  port: 8082

spring:
  application:
    name: proveedores
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/proveedores}
    username: ${DB_USER:proveedores}
    password: ${DB_PASSWORD:proveedores}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: proveedores
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Clave secreta de cada proveedor para autenticar sus webhooks (riesgo RI-6).
# En producción se guardarían en un gestor de secretos, no en este archivo.
trotamundos:
  webhooks:
    claves:
      aerolinea-demo: clave-aerolinea-demo
      hotel-demo: clave-hotel-demo

management:
  endpoints:
    web:
      exposure:
        include: health
